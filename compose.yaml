# The core services, networks and external volumes of Lyrveil, the text and image runtimes of the "ai" profile and the
# model download tool of the "tools" profile. docs/operations.md (Reference Compose file) is the specification of this
# file: change both together.
#
# Images are built locally from the repository root and never pulled, so the runtime works offline:
#   docker compose build
# The volumes are created by setup.cmd, never by Compose, so "docker compose down -v" cannot remove them.
name: lyrveil

x-common: &common
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pull_policy: never
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

# A missing .env does not stop "config" or "build". The backend then refuses to start with exit status 78 and names
# LYRVEIL_CONTROL_TOKEN, which is clearer than a Compose error.
x-env-file: &env-file
  - {path: .env, required: false}

services:
  lyrveil-frontend:
    <<: *common
    container_name: lyrveil-frontend
    image: lyrveil/frontend:local
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    ports: ["${LYRVEIL_BIND_ADDRESS:-127.0.0.1}:${LYRVEIL_HTTP_PORT:-4200}:8080"]
    networks: [lyrveil-edge, lyrveil-app]
    depends_on:
      lyrveil-backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  lyrveil-backend:
    <<: *common
    container_name: lyrveil-backend
    image: lyrveil/backend:local
    build: {context: ., dockerfile: backend/Dockerfile, target: runtime}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    env_file: *env-file
    volumes:
      - lyrveil-data:/data
      - lyrveil-models:/models:ro     # Lists and hashes files for custom profiles
    networks: [lyrveil-app, lyrveil-control, lyrveil-runtime]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  lyrveil-orchestrator:
    <<: *common
    container_name: lyrveil-orchestrator
    image: lyrveil/orchestrator:local
    build: {context: ., dockerfile: orchestrator/Dockerfile, target: runtime}
    restart: unless-stopped
    user: "10001:10001"
    group_add: ["0"]           # The Docker socket is root:root, mode 660, inside containers
    read_only: true
    tmpfs: [/tmp]
    gpus: all                  # NVML only. No model runs here and no VRAM is allocated
    env_file: *env-file
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [lyrveil-control]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # The text runtime, KoboldCpp, built by docker/llm/Dockerfile. The orchestrator starts and stops it, so nothing depends
  # on it and it never restarts by itself. It reads its settings from runtime/llm-launch.env and the model from llm/,
  # both read-only, and exits 78 for an invalid launch file. The two subpaths must exist in the volumes.
  lyrveil-llm:
    <<: *common
    profiles: [ai]
    container_name: lyrveil-llm
    image: lyrveil/llm:local
    build: {context: ., dockerfile: docker/llm/Dockerfile}
    restart: "no"
    user: "10001:10001"
    gpus: all
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - {type: volume, source: lyrveil-models, target: /models/llm, read_only: true, volume: {subpath: llm}}
      - {type: volume, source: lyrveil-data, target: /run/lyrveil, read_only: true, volume: {subpath: runtime}}
    networks: [lyrveil-runtime]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/v1/model"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 240s
      start_interval: 2s

  # The image runtime, ComfyUI, built by docker/image/Dockerfile. The orchestrator starts and stops it, so nothing
  # depends on it and it never restarts by itself. It reads its settings from runtime/image-launch.env and the
  # checkpoints from image/checkpoints/, both read-only, and exits 78 for an invalid launch file. Everything it writes,
  # including HOME and TMPDIR, stays in the tmpfs /tmp/comfy, so it keeps no state. The two subpaths must exist.
  lyrveil-image:
    <<: *common
    profiles: [ai]
    container_name: lyrveil-image
    image: lyrveil/image:local
    build: {context: ., dockerfile: docker/image/Dockerfile, target: runtime}
    restart: "no"
    user: "10001:10001"
    gpus: all
    read_only: true
    environment:
      HOME: /tmp/comfy/home
    volumes:
      - {type: volume, source: lyrveil-models, target: /opt/ComfyUI/models/checkpoints, read_only: true, volume: {subpath: image/checkpoints}}
      - {type: volume, source: lyrveil-data, target: /run/lyrveil, read_only: true, volume: {subpath: runtime}}
      - type: tmpfs
        target: /tmp/comfy
        tmpfs: {size: 4294967296}
    networks: [lyrveil-runtime]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8188/system_stats', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
      start_interval: 2s

  # One-shot model downloader, run only by "scripts\lyrveil.cmd models" with "docker compose run". It reuses the
  # backend image, is the only service with a route out, and mounts nothing but the models volume.
  lyrveil-models:
    <<: *common
    profiles: [tools]
    image: lyrveil/backend:local
    restart: "no"
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["python", "-m", "lyrveil.tools.models"]
    volumes:
      - lyrveil-models:/models
    networks: [lyrveil-download]

# Only lyrveil-edge and lyrveil-download have a route out, and only the frontend and the one-shot download tool join
# them. The backend, the orchestrator and the runtimes see internal networks only (ADR 0003, T-DCK-08).
networks:
  lyrveil-edge: {driver: bridge}
  lyrveil-app: {internal: true}
  lyrveil-control: {internal: true}
  lyrveil-runtime: {internal: true}
  lyrveil-download: {driver: bridge}   # Only the one-shot download tool joins it

volumes:
  lyrveil-data: {external: true}       # Created by setup.cmd, so down -v cannot remove it
  lyrveil-models: {external: true}
