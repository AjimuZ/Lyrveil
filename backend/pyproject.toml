# Lyrveil backend: dependencies, tool settings and quality gates. Versions follow docs/technology.md, and uv.lock
# pins every package with its hashes. Regenerate the lock with the "lockfile" stage of backend/Dockerfile.

[project]
name = "lyrveil"
version = "0.0.0"
description = "Lyrveil backend: API, services and job worker."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "structlog==26.1.0",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "schemathesis==4.33.0",
]

[tool.uv]
# The project is not built or installed: the image puts src/ on PYTHONPATH, so no unpinned build backend is needed.
package = false
# The lock serves the Linux images only.
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "-p", "no:cacheprovider"]
