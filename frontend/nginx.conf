# Serves the built app on port 8080 and proxies /api, /media and /ws to the backend (docs/frontend.md, Container).
# Installed as /etc/nginx/conf.d/default.conf, inside the http block of the image's nginx.conf.

# A WebSocket upgrade keeps the connection open; any other request lets the backend close it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 80m;

    # Security headers of docs/security.md (HTTP headers), on every response, errors included. Locations below set
    # no add_header of their own, so they all inherit these; caching uses "expires", which does not break that.
    # The WebSocket origins name the default port 4200; with another LYRVEIL_HTTP_PORT, 'self' covers same-origin
    # WebSockets in browsers that implement CSP Level 3.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' ws://localhost:4200 ws://127.0.0.1:4200; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The Compose health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The original Host, with its port, and Origin reach the backend unchanged.
    location /api/ {
        proxy_pass http://lyrveil-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
    }

    location /media/ {
        proxy_pass http://lyrveil-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
    }

    # Events stream to the browser as they come: no buffering, and an idle connection survives for an hour.
    location = /ws {
        proxy_pass http://lyrveil-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Files whose names carry the build's content hash never change, so browsers keep them for a year.
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|otf|svg|png|webp|jpg)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Every other path is a client route: index.html, revalidated on each load so a new build shows at once.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
