# Override of compose.yaml for tests/docker/Lifecycle.Tests.ps1, which runs start, stop, restart, status and logs
# against the project "lyrveil-lifecycle-test":
#   docker compose -p lyrveil-lifecycle-test -f compose.yaml -f tests/docker/compose.lifecycle-test.yaml config
# It keeps compose.yaml's services, health checks and external volumes, so the commands meet the real file, and changes
# only what would reach a real installation:
#   - the two external volumes get their own names, never "lyrveil-data" or "lyrveil-models";
#   - every image is tagged ":lifecycle-test", so no build replaces the ":local" images of an installation;
#   - container_name is reset, so the containers are "lyrveil-lifecycle-test-*" and never "lyrveil-backend" and the
#     others of an installation;
#   - the app is published on 127.0.0.1:14210, never 4200 (an installation) or 14200 (the e2e level);
#   - env_file is reset, so no container reads the repository's .env; the backend gets the settings below, with a
#     token that guards only this project.
# No test uses a backup folder: start and stop copy no backup until P03.7b.
services:
  lyrveil-frontend:
    image: lyrveil/frontend:lifecycle-test
    container_name: !reset null
    ports: !override ["127.0.0.1:14210:8080"]
  lyrveil-backend:
    image: lyrveil/backend:lifecycle-test
    container_name: !reset null
    env_file: !reset []
    environment:
      LYRVEIL_CONTROL_TOKEN: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      LYRVEIL_TZ: Europe/Rome
      LYRVEIL_LOG_LEVEL: DEBUG
  lyrveil-orchestrator:
    image: lyrveil/orchestrator:lifecycle-test
    container_name: !reset null
    env_file: !reset []
  # The text runtime is left out of this project: a profile that no command enables keeps it from setup's build and
  # "create", so the tests need no 629 MB download, no GPU and no model. Its tag and container name still differ from
  # an installation's, should anything enable it.
  lyrveil-llm:
    profiles: !override [not-in-lifecycle-test]
    image: lyrveil/llm:lifecycle-test
    container_name: !reset null

volumes:
  lyrveil-data: {external: true, name: lyrveil-lifecycle-test-data}
  lyrveil-models: {external: true, name: lyrveil-lifecycle-test-models}
